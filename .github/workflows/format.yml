name: Formatting

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clang-format:
    name: clang-format
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Read pinned clang-format version
        id: pin
        run: printf 'major=%s\n' "$(tr -d '[:space:]' < .clang-format-version)" >> "$GITHUB_OUTPUT"

      - name: Install clang-format
        run: |
          python3 -m venv "$RUNNER_TEMP/clang-format"
          "$RUNNER_TEMP/clang-format/bin/python" -m pip install \
            "clang-format~=${{ steps.pin.outputs.major }}.0"

      - name: Verify formatting
        run: CLANG_FORMAT="$RUNNER_TEMP/clang-format/bin/clang-format" ./scripts/ci-format.sh
