name: Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: Core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Verify release metadata
        run: ./scripts/check-version-sync.sh

      - name: Build and test core
        run: ./scripts/ci-verify.sh core

  sanitizers:
    name: Sanitizers (ASan+UBSan)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build and test with sanitizers
        run: ./scripts/ci-verify.sh sanitize

  go-bindings:
    name: Go bindings (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: bindings/go/go.mod

      - name: Verify bundled C sources
        run: ./scripts/sync-go-core.sh --check

      - name: Test Go bindings
        working-directory: bindings/go
        run: GOEXPERIMENT=cgocheck2 go test -v -race ./...

      - name: Install 32-bit C compiler support
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib

      - name: Test 32-bit Go bindings
        if: runner.os == 'Linux'
        working-directory: bindings/go
        run: GOARCH=386 CGO_ENABLED=1 GOEXPERIMENT=cgocheck2 go test -v ./...

      - name: Test standalone Go module
        run: ./scripts/check-go-module.sh
